name: Build and regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm install --no-save --no-audit --no-fund playwright pngjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-buttons.mjs
      - run: node tests/browser-campaign.mjs
      - run: node tests/browser-input.mjs
