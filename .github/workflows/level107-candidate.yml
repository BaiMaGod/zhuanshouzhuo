name: Level 107 source-driven geometry candidate
on:
  push:
    branches: [feature/levels-101-200-engine]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/level107-geometry-candidate.test.mjs
      - run: node --test tests/level107-geometry-probe.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: level107-candidate-geometry
          path: |
            tests/results/level107-geometry-candidate.json
            tests/results/level107-geometry-probe.json
          if-no-files-found: warn
          retention-days: 7
