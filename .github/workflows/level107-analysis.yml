name: Level 107 base geometry analysis
on:
  push:
    branches: [feature/levels-101-200-engine]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/level107-base-analysis.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: level107-base-analysis
          path: tests/results/level107-base-analysis.json
          if-no-files-found: error
          retention-days: 3
