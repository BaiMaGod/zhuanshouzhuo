<style>

<main class="app">
<div class="eyebrow">BRACELET / PUZZLE LAB</div>
<header><h1>转手镯消除</h1><select id="level" aria-label="选择关卡"></select></header>
<p class="lead">拖动手镯旋转。银扣固定，金扣随所属手镯转动。<br>缺口只比卡扣略宽，对准重合才解扣；金扣碰到实体会停住。</p>

<div class="stage">

<div class="secondary"><button id="undo">撤销</button><button id="restart">重新开始</button><button id="demo">演示整关</button></div>
<p class="note">共 12 关，第 8–12 关增加到 6、8、9、12、16 只手镯。<br>拖动或点击镯子，用 ↶ / ↷ 微调。第 6、7、9 关体验跟随卡扣。<br>金扣固定在所属手镯上，碰到其他镯子的实体边缘便停止；<br>转另一只镯子的细缺口对准金扣，就解除连接。<br>每只镯子必须解除全部连接才消除。演示和自动对准也遵守碰撞。</p>
</main>

];
let state,chosen='A',history=[],drag=null,busy=false,demo=false,epoch=0,winTimer=0,blocked=null;

function point(r,a,rad=r.radius){a*=Math.PI/180;return{x:r.x+Math.cos(a)*rad,y:r.y+Math.sin(a)*rad}}

function target(r,l){return norm(Math.atan2(l.y-r.y,l.x-r.x)*180/Math.PI)}
function say(s){$('message').textContent=s}
function save(){history.push(JSON.stringify(state));if(history.length>80)history.shift()}

 if(far<r.radius)socket=d1>d2?p.p1:p.p2;
 else if(near>r.radius){const dx=p.p2.x-p.p1.x,dy=p.p2.y-p.p1.y,t=Math.max(0,Math.min(1,((r.x-p.p1.x)*dx+(r.y-p.p1.y)*dy)/(dx*dx+dy*dy)));socket={x:p.p1.x+t*dx,y:p.p1.y+t*dy}}
 else{const dx=p.p2.x-p.p1.x,dy=p.p2.y-p.p1.y,ox=p.p1.x-r.x,oy=p.p1.y-r.y,A=dx*dx+dy*dy,B=2*(ox*dx+oy*dy),C=ox*ox+oy*oy-r.radius*r.radius,D=Math.sqrt(Math.max(0,B*B-4*A*C)),ts=[(-B-D)/(2*A),(-B+D)/(2*A)],t=ts.find(t=>t>=0&&t<=1)??0;socket={x:p.p1.x+t*dx,y:p.p1.y+t*dy}}

function load(index){cancel();history=[];state=makeState(index);chosen='A';$('level').value=index;mount();say(levels[index].hint)}

 nodes.set(r.id,{g,halo,path,shine,dot,hit,count});}

 const p=pose(l),g=element('g',{transform:`translate(${p.x} ${p.y}) rotate(${p.axis})`},holder);
 const title=element('title',{},holder);title.textContent=l.type==='follow'?`随 ${l.a} 镯转动的卡扣，连接 ${l.b} 镯，碰到实体会停止`:'世界位置固定的卡扣';
 if(l.type==='follow'){element('path',{d:'M -13 0 L 13 0',fill:'none',stroke:'#976d28','stroke-width':7,'stroke-linecap':'round'},g);element('path',{d:'M -13 0 L 13 0',fill:'none',stroke:'#e7b95e','stroke-width':6,'stroke-linecap':'round'},g)}else element('rect',{x:-19,y:-3,width:38,height:6,rx:2,fill:'url(#metal)',stroke:'#526b61','stroke-width':1},g);
 for(const x of[-14,9])element('rect',{x,y:-2,width:4,height:4,rx:1,fill:l.type==='follow'?'#f4d991':'#aebfb2'},g);
 element('circle',{cx:0,cy:0,r:2.5,fill:'#f0eee2',stroke:'#6c8376','stroke-width':1},g);
 element('path',{d:'M -2 -1 L 2 1',stroke:'#607568','stroke-width':1.5},g);
 if(l.type==='follow'){element('circle',{cx:-13,cy:0,r:2.5,fill:'#a47732'},g);const label=element('text',{x:p.x,y:p.y-22,'text-anchor':'middle','font-size':10,fill:'#a47732','data-owner-label':l.id},holder);label.textContent='随 '+l.a;}
 if(!l.b)element('circle',{cx:-22,cy:0,r:4,fill:'#7f9184'},g);clamps.set(l.id,holder);}
 update();}
function update(){for(const r of state.rings){const n=nodes.get(r.id);if(!n)continue;const d=arc(r);n.path.setAttribute('d',d);n.shine.setAttribute('d',d);n.hit.setAttribute('d',d);const p=point(r,r.rot,r.radius+16);n.dot.setAttribute('cx',p.x);n.dot.setAttribute('cy',p.y);n.path.setAttribute('stroke',blocked?.ring===r.id?'#d36854':colours[state.rings.indexOf(r)%colours.length][0]);n.halo.style.display=!r.removed&&chosen===r.id?'':'none';n.count.textContent=active(r).length+(r.radius<=45?' 扣':' 个卡扣');if(r.removed)n.g.classList.add('removed')}
 const live=state.rings.filter(r=>!r.removed);$('progress').innerHTML=`已拆 <b>${state.rings.length-live.length}/${state.rings.length}</b>`;$('moves').textContent=state.moves;$('selected').textContent=live.length?'选中 '+chosen+' 镯':'全部完成';
 for(const id of['left','right','align'])$(id).disabled=busy||demo||!live.length;$('undo').disabled=!history.length;
 for(const l of state.locks){const holder=clamps.get(l.id);if(!holder)continue;if(l.type==='follow'){const p=pose(l),g=holder.firstElementChild;g.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${p.axis})`);g.style.filter=blocked?.pin===l.id?'drop-shadow(0 0 4px #d65537)':'';const label=holder.querySelector('[data-owner-label]');if(label){label.setAttribute('x',p.x);label.setAttribute('y',p.y-22)}if(state.rings.find(r=>r.id===l.a).removed)holder.classList.add('released')}else if(l.broken)holder.classList.add('released')}
}
function check(r){let opened=0;
 for(const l of active(r)){if(l.type==='fixed'&&Math.abs(diff(r.rot,target(r,l)))<=tolerance(r,l)){l.broken=true;opened++}}
 for(const l of state.locks){if(releaseReady(l)){l.broken=true;opened++}}
 settle(opened);return opened}
function blockedMessage(){if(blocked)say(`金扣被 ${blocked.ring} 镯挡住，${blocked.owner} 镯无法继续转。把 ${blocked.ring} 镯的细缺口转到金扣接触处，或先拆掉挡路镯。`)}
function turn(r,delta){blocked=null;let opened=0;const steps=Math.max(1,Math.ceil(Math.abs(delta)/.25)),step=delta/steps;
 for(let i=0;i<steps&&!r.removed;i++){const before=r.rot;r.rot=norm(before+step);const hit=collision();if(hit){r.rot=before;
 // Clamp to the first contact. No teleport across an occupied arc, even for a fast drag.
 let low=0,high=1;for(let j=0;j<12;j++){const mid=(low+high)/2;r.rot=norm(before+step*mid);if(collision())high=mid;else low=mid}r.rot=norm(before+step*low);opened+=check(r);blocked=hit;break}
 opened+=check(r)}update();blockedMessage();return{blocked:!!blocked,opened}}
function selected(){return state.rings.find(r=>r.id===chosen&&!r.removed)}
function manual(delta){const r=selected();if(!r||busy||demo)return;save();state.moves++;const result=turn(r,delta);if(!result.blocked&&!result.opened&&!r.removed&&active(r).length)say(`${r.id} 镯还连着 ${active(r).length} 个卡扣，请继续转动。`)}
function boardPoint(e){const p=$('board').createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform($('board').getScreenCTM().inverse())}
function polar(p,r){return Math.atan2(p.y-r.y,p.x-r.x)*180/Math.PI}
$('board').addEventListener('pointerdown',e=>{if(busy||demo||drag||e.isPrimary===false)return;const g=e.target.closest('[data-ring]');if(!g)return;const r=state.rings.find(x=>x.id===g.dataset.ring);if(!r||r.removed)return;e.preventDefault();save();chosen=r.id;const p=boardPoint(e);drag={r,id:e.pointerId,angle:polar(p,r),x:e.clientX,y:e.clientY,moved:false};$('board').setPointerCapture(e.pointerId);update()});
$('board').addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>4&&!d.moved){d.moved=true;state.moves++}const a=polar(boardPoint(e),d.r),delta=diff(norm(a),norm(d.angle));if(d.moved)turn(d.r,delta);d.angle=a});
function end(e,cancelled=false){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;if(!cancelled&&!d.moved){state.moves++;turn(d.r,15)}update();if($('board').hasPointerCapture(e.pointerId))$('board').releasePointerCapture(e.pointerId)}
$('board').addEventListener('pointerup',e=>end(e));$('board').addEventListener('pointercancel',e=>end(e,true));$('board').addEventListener('lostpointercapture',()=>{drag=null});
async function animateTurn(r,delta,record=true){const token=epoch;if(record){save();state.moves++}const start=performance.now();let previous=0,result={blocked:false,opened:0};busy=true;update();
 await new Promise(resolve=>{function frame(now){if(token!==epoch){resolve();return}const t=Math.min(1,(now-start)/650),angle=delta*(1-Math.pow(1-t,3));result=turn(r,angle-previous);previous=angle;if(t<1&&!r.removed&&!result.blocked)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});
 if(token===epoch){busy=false;update()}return result}
async function alignOne(){const r=selected();if(!r||!active(r).length)return;const dock=active(r).find(l=>l.type==='follow'&&l.docked&&l.a===r.id);if(dock){say(`金扣仍扣住 ${dock.b} 镯，先选 ${dock.b}，让细缺口转到金扣处。`);return}const fixed=active(r).filter(l=>l.type==='fixed');let angle;
 if(fixed.length){const l=fixed.reduce((best,l)=>Math.abs(diff(target(r,l),r.rot))<Math.abs(diff(target(r,best),r.rot))?l:best);angle=target(r,l)}
 else{const l=active(r)[0];if(l.a===r.id)angle=r.rot;else{const c=contact(l,r);if(!c.touching){say(`先转 ${l.a} 镯，让金扣靠到 ${r.id} 镯边缘，再转 ${r.id} 的缺口对准。`);return}angle=c.angle}}
 return await animateTurn(r,diff(angle,r.rot))}
function demoChoice(){const latch=state.locks.find(l=>l.type==='follow'&&l.docked&&!l.broken);if(latch){const receiver=state.rings.find(r=>r.id===latch.b);return{r:receiver,angle:latch.socketAngle}}
 const fixed=state.locks.find(l=>!l.broken&&l.type==='fixed');if(fixed){const r=state.rings.find(r=>r.id===fixed.a&&!r.removed);return{r,angle:target(r,fixed)}}return null}
$('align').onclick=()=>alignOne();$('left').onclick=()=>manual(-1);$('right').onclick=()=>manual(1);
$('restart').onclick=()=>load(state.index);$('level').onchange=()=>load(Number($('level').value));$('next').onclick=()=>load((state.index+1)%levels.length);
$('undo').onclick=()=>{if(!history.length)return;cancel();state=JSON.parse(history.pop());chosen=state.rings.find(r=>!r.removed)?.id||'';mount();say('已撤销上一次操作，可以换一种拆解顺序。')};
$('demo').onclick=async()=>{if(demo){cancel();update();say('演示已停止，你可以继续手动操作。');return}if(busy||!selected())return;demo=true;$('demo').textContent='停止演示';const token=epoch;let guard=0;
 while(demo&&token===epoch&&state.rings.some(r=>!r.removed)&&guard++<state.locks.length+state.rings.length){const plan=demoChoice();if(!plan)break;chosen=plan.r.id;const result=await animateTurn(plan.r,diff(plan.angle,plan.r.rot));if(token!==epoch||(result.blocked&&blocked?.ring!==plan.expectedBlock))break;await new Promise(resolve=>setTimeout(resolve,180))}
 if(token===epoch){demo=false;$('demo').textContent='演示整关';update();if(blocked)blockedMessage()}};
document.addEventListener('keydown',e=>{if(e.target.matches('select,button'))return;if(e.key==='ArrowLeft'){e.preventDefault();manual(-1)}if(e.key==='ArrowRight'){e.preventDefault();manual(1)}});
levels.forEach((l,i)=>{const option=document.createElement('option');option.value=i;option.textContent=l.name;$('level').appendChild(option)});load(7);
})();
